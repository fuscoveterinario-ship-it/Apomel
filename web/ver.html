<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apiário Bee Guard</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="icone.png">
<link rel="apple-touch-icon" href="icone.png">
<meta name="theme-color" content="#111111">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>
<header><a class="marca" href="index.html"><img src="icone.png" alt="" width="40" height="40"><span>BEEGUARD<small>Visualização do apiário</small></span></a></header>
<main>
  <section class="card" id="carregando"><p>Carregando…</p></section>
  <p class="erro card" id="erro" hidden></p>
  <section id="topo" hidden></section>
  <section class="card" id="mapa-card" hidden><h2>Mapa</h2><div id="map"></div>
    <p class="msg" id="mapa-nota"></p></section>
  <section id="lista" hidden></section>
  <p class="msg rodape" id="rodape" hidden>Somente visualização. A página atualiza sozinha a cada minuto.</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
import { $, show, sb, ago, fmtDate, batteryPct, mapsLink, errorText, esc } from "./app.js";
import { balanca, producao, statusDe } from "./render.js";

let map, camada, enquadrado = false;
const token = new URLSearchParams(location.search).get("t") || "";

async function carregar() {
  const { data, error } = await sb.rpc("colmeia_shared_view", { p_token: token });
  show("#carregando", false);
  if (error) {
    $("#erro").textContent = /inválido|expirado/i.test(error.message)
      ? "Este link não vale mais. Peça um link novo ao dono do apiário." : errorText(error);
    show("#erro");
    return;
  }
  const { devices, alertas, pesos, colheitas, colmeias = [], exata = false } = data;
  const apiarios = data.apiarios || [data.apiario];
  const nomeAp = Object.fromEntries(apiarios.map((a) => [a.id, a.name]));
  const nomeCol = (d) => colmeias.find((h) => h.id === d.hive_id)?.label || d.hive_label || d.id;
  const natural = (x, y) => String(x).localeCompare(String(y), "pt-BR", { numeric: true });
  const kg = (n) => Number(n).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " kg";
  const ano = new Date().getFullYear();
  const apicultor = apiarios.find((a) => a.apicultor)?.apicultor;
  document.title = `${apiarios.length > 1 ? (apicultor || "Apiários") : apiarios[0].name} · Bee Guard`;

  // Topo: apicultor e totais de todos os apiários do link.
  // Produção só aparece nos apiários com balança (colmeia sentinela).
  const temBalanca = (id) => devices.some((d) => d.apiary_id === id && d.scale_factor !== null && d.scale_factor !== undefined);
  const comBalanca = apiarios.filter((a) => temBalanca(a.id)).map((a) => a.id);
  const melAno = (id) => colheitas.filter((h) => (id ? h.apiary_id === id : comBalanca.includes(h.apiary_id)) && h.harvested_on.startsWith(String(ano)))
    .reduce((t, h) => t + Number(h.kg), 0);
  $("#topo").innerHTML = `<article class="card topo">
      <h1>${esc(apicultor ? `Apicultor: ${apicultor}` : apiarios[0].name)}</h1>
      <div class="grid">
        <div><span>Apiários</span><b>${apiarios.length}</b></div>
        <div><span>Colmeias</span><b>${colmeias.length}</b></div>
        <div><span>Com rastreador</span><b>${devices.length}</b></div>
        ${comBalanca.length ? `<div><span>Mel colhido em ${ano}</span><b>${kg(melAno())}</b></div>` : ""}
      </div>
    </article>`;
  show("#topo");

  // Mapa: alfinete no ponto exato (se o apicultor escolheu mostrar) ou círculo da região.
  const comLocal = devices.filter((d) => (exata ? d.lat : d.regiao_lat) !== null && (exata ? d.lat : d.regiao_lat) !== undefined);
  if (comLocal.length && window.L) {
    show("#mapa-card");
    $("#mapa-nota").textContent = exata ? "Toque no alfinete para ver o nome da colmeia."
      : "Localização aproximada (região de cerca de 1 km). O ponto exato das caixas não aparece neste link.";
    if (!map) {
      map = L.map("map");
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
    }
    if (camada) camada.remove();
    camada = L.featureGroup(comLocal.map((d) => {
      const popup = `<b>${esc(nomeCol(d))}</b><br>${esc(nomeAp[d.apiary_id] || "")}`;
      if (exata) return L.marker([Number(d.lat), Number(d.lon)]).bindPopup(popup);
      return L.circle([Number(d.regiao_lat), Number(d.regiao_lon)], {
        radius: 600, color: statusDe(d, alertas)[0] === "alerta" ? "#c62828" : "#e0a100", fillOpacity: 0.25,
      }).bindPopup(popup);
    })).addTo(map);
    if (!enquadrado) { map.fitBounds(camada.getBounds(), { maxZoom: exata ? 16 : 13, padding: [30, 30] }); enquadrado = true; }
  }

  // Situação do apiário: ataque (2+ caixas em alerta), alerta, manutenção ou protegido.
  const situacao = (ds) => {
    const emAlerta = ds.filter((d) => statusDe(d, alertas)[0] === "alerta");
    if (emAlerta.length >= 2) return ["alerta", `ATAQUE AO APIÁRIO: ${emAlerta.length} caixas`];
    if (emAlerta.length === 1) return ["alerta", `alerta em ${nomeCol(emAlerta[0])}`];
    if (ds.length && ds.every((d) => d.maintenance_until && new Date(d.maintenance_until) > new Date())) {
      return ["aviso", `manutenção até ${fmtDate(ds[0].maintenance_until)}`];
    }
    return ["ok", ds.length ? "protegido" : "sem rastreador"];
  };
  const resumo = (a, ds) => {
    const [cls, txt] = situacao(ds);
    const sentinela = ds.find((d) => d.last_weight_kg !== null && d.last_weight_kg !== undefined);
    return `<article class="card grupo ${cls === "alerta" ? "grupo-alerta" : ""}">
      <h2>${esc(a.name)} <span class="status ${cls}">${esc(txt)}</span><small>${esc(a.city || "")}</small></h2>
      <div class="grid">
        <div><span>Colmeias</span><b>${colmeias.filter((h) => h.apiary_id === a.id).length}</b></div>
        <div><span>Com rastreador</span><b>${ds.length}</b></div>
        <div><span>Peso (colmeia sentinela)</span><b>${sentinela ? esc(kg(sentinela.last_weight_kg)) : "—"}</b></div>
        ${temBalanca(a.id) ? `<div><span>Mel colhido em ${ano}</span><b>${esc(kg(melAno(a.id)))}</b></div>` : ""}
      </div>
    </article>`;
  };
  const cartao = (d) => {
    const [cls, txt] = statusDe(d, alertas);
    const pct = batteryPct(d.last_battery_mv);
    return `<article class="card">
      <h2>${esc(nomeCol(d))} <span class="status ${cls}">${esc(txt)}</span></h2>
      <div class="grid">
        <div><span>Apiário</span><b>${esc(nomeAp[d.apiary_id] || "—")}</b></div>
        <div><span>Rastreador</span><b>${esc(d.id)}</b></div>
        <div><span>Última mensagem</span><b>${ago(d.last_seen_at)}</b></div>
        <div><span>Bateria</span><b>${pct === null ? "—" : pct + "%"}</b></div>
      </div>
      ${balanca(d, pesos.filter((p) => p.device_id === d.id), { readonly: true })}
      ${exata && d.lat ? `<a class="btn secundario" target="_blank" rel="noopener" href="${mapsLink(d.lat, d.lon)}">Ver no Google Maps</a>` : ""}
    </article>`;
  };
  const ordenadas = [...devices].sort((x, y) => natural(nomeCol(x), nomeCol(y)));
  $("#lista").innerHTML = apiarios.map((a) => {
    const ds = ordenadas.filter((d) => d.apiary_id === a.id);
    return `<div class="bloco-apiario">${resumo(a, ds)}${ds.map(cartao).join("")}
      ${temBalanca(a.id) ? producao([a], devices, colheitas, { readonly: true, hives: colmeias }) : ""}</div>`;
  }).join("");
  show("#lista");
  show("#rodape");
}

if (!token) {
  show("#carregando", false);
  $("#erro").textContent = "Link incompleto. Abra o link exatamente como foi enviado.";
  show("#erro");
} else {
  carregar();
  setInterval(carregar, 60000);
}
</script>
</body>
</html>

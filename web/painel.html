<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus rastreadores</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="icone.png">
<link rel="apple-touch-icon" href="icone.png">
<meta name="theme-color" content="#111111">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>
<header><a class="marca" href="index.html"><img src="icone.png" alt="" width="40" height="40"><span>BEEGUARD<small>Meus rastreadores</small></span></a></header>
<main>
  <section class="card" id="login"><p class="msg">Carregando… (precisa de internet)</p></section>
  <section id="lista" hidden></section>
  <section id="producao" hidden></section>
  <section class="card" id="mapa-card" hidden><h2>Mapa</h2><div id="map"></div></section>
  <button class="secundario" id="sair" hidden>Sair</button>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
import { $, show, sb, ensureLogin, ago, fmtDate, batteryPct, mapsLink, errorText, esc } from "./app.js";

let map, layer;
const abertos = new Set();  // balanças com os ajustes abertos (sobrevive à atualização automática)

const kg = (v) => v === null || v === undefined ? "—" : `${Number(v).toLocaleString("pt-BR", { maximumFractionDigits: 1 })} kg`;

// Gráfico simples do peso dos últimos 14 dias.
function grafico(pts) {
  if (pts.length < 2) return '<p class="msg">O gráfico aparece depois de algumas pesagens.</p>';
  const t0 = new Date(pts[0].measured_at).getTime(), t1 = new Date(pts[pts.length - 1].measured_at).getTime();
  const vs = pts.map((p) => Number(p.kg)), lo = Math.min(...vs), hi = Math.max(...vs), span = Math.max(hi - lo, 1);
  const xy = pts.map((p, i) => `${(((new Date(p.measured_at).getTime() - t0) / Math.max(t1 - t0, 1)) * 300).toFixed(1)},${(56 - ((vs[i] - lo) / span) * 52).toFixed(1)}`);
  return `<svg class="peso-graf" viewBox="0 0 300 60" preserveAspectRatio="none" role="img" aria-label="Peso dos últimos 14 dias">
      <polyline points="${xy.join(" ")}" /></svg>
    <div class="peso-eixo"><span>${fmtDate(pts[0].measured_at)}</span><span>mín. ${kg(lo)} · máx. ${kg(hi)}</span></div>`;
}

// ---------------------------------------------------------------------------
// Produção de mel por apiário
// ---------------------------------------------------------------------------
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const fmtKg = (v) => `${Number(v).toLocaleString("pt-BR", { maximumFractionDigits: 1 })} kg`;

// Barras com o mel colhido em cada um dos últimos 12 meses.
function graficoMeses(hs) {
  const hoje = new Date();
  const meses = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
    meses.push({ y: d.getFullYear(), m: d.getMonth(), kg: 0 });
  }
  for (const h of hs) {
    const [y, m] = h.harvested_on.split("-").map(Number);
    const b = meses.find((x) => x.y === y && x.m === m - 1);
    if (b) b.kg += Number(h.kg);
  }
  const max = Math.max(...meses.map((x) => x.kg), 1);
  const bw = 300 / 12;
  return `<svg class="prod-graf" viewBox="0 0 300 96" role="img" aria-label="Mel colhido por mês nos últimos 12 meses">
    ${meses.map((x, i) => {
      const h = (x.kg / max) * 60;
      const cx = i * bw + bw / 2;
      return `<rect x="${(i * bw + 4).toFixed(1)}" y="${(76 - h).toFixed(1)}" width="${(bw - 8).toFixed(1)}" height="${Math.max(h, 0.5).toFixed(1)}" rx="2"><title>${MESES[x.m]}/${x.y}: ${fmtKg(x.kg)}</title></rect>
        ${x.kg ? `<text class="val" x="${cx.toFixed(1)}" y="${(72 - h).toFixed(1)}">${Math.round(x.kg)}</text>` : ""}
        <text x="${cx.toFixed(1)}" y="90">${MESES[x.m]}</text>`;
    }).join("")}</svg><p class="msg legenda">kg de mel colhidos por mês</p>`;
}

function producao(apiarios, devs, hs) {
  const ano = new Date().getFullYear();
  const nomeCaixa = Object.fromEntries(devs.map((d) => [d.id, d.hive_label || d.id]));
  const hoje = new Date().toLocaleDateString("sv-SE");  // AAAA-MM-DD no fuso do aparelho
  return apiarios.map((a) => {
    const lista = hs.filter((h) => h.apiary_id === a.id);
    const doAno = lista.filter((h) => h.harvested_on.startsWith(String(ano)));
    const total = doAno.reduce((t, h) => t + Number(h.kg), 0);
    const porCaixa = {};
    for (const h of doAno) {
      const k = h.device_id ? nomeCaixa[h.device_id] || h.device_id : "Apiário / caixas sem rastreador";
      porCaixa[k] = (porCaixa[k] || 0) + Number(h.kg);
    }
    const caixas = devs.filter((d) => d.apiary_id === a.id);
    const aid = esc(a.id);
    return `<article class="card producao">
      <h2>Produção de mel <small>${esc(a.name)}</small></h2>
      <div class="grid">
        <div><span>Colhido em ${ano}</span><b>${fmtKg(total)}</b></div>
        <div><span>Colheitas em ${ano}</span><b>${doAno.length}</b></div>
      </div>
      ${lista.length ? graficoMeses(lista) : '<p class="msg">Nenhuma colheita registrada ainda.</p>'}
      ${Object.keys(porCaixa).length ? `<h3>Por caixa em ${ano}</h3><ul class="prod-caixas">${Object.entries(porCaixa)
        .sort((x, y) => y[1] - x[1]).map(([k, v]) => `<li><span>${esc(k)}</span><b>${fmtKg(v)}</b></li>`).join("")}</ul>` : ""}
      ${lista.length ? `<h3>Últimas colheitas</h3><ul class="prod-lista">${lista.slice(0, 8).map((h) => `<li>
          <div><b>${fmtKg(h.kg)}</b> · ${esc(new Date(h.harvested_on + "T12:00:00").toLocaleDateString("pt-BR"))}<br>
            <small>${esc(h.device_id ? nomeCaixa[h.device_id] || h.device_id : "Apiário / caixas sem rastreador")}${
              h.source === "balanca" ? " · estimado pela balança" : ""}${h.note ? " · " + esc(h.note) : ""}</small></div>
          <button class="mini secundario" data-delcol="${esc(h.id)}">Apagar</button></li>`).join("")}</ul>` : ""}
      <details data-bal="prod-${aid}" ${abertos.has("prod-" + a.id) ? "open" : ""}>
        <summary>Registrar colheita</summary>
        <label>Caixa<select id="col-cx-${aid}"><option value="">Apiário todo / caixa sem rastreador</option>${
          caixas.map((d) => `<option value="${esc(d.id)}">${esc(d.hive_label || d.id)}</option>`).join("")}</select></label>
        <label>Data da colheita<input type="date" id="col-dt-${aid}" value="${hoje}"></label>
        <label>Mel colhido (kg)<input type="number" id="col-kg-${aid}" min="0.1" step="0.1" inputmode="decimal"></label>
        <label>Observação (opcional)<input id="col-obs-${aid}" maxlength="200" placeholder="Ex.: florada de eucalipto"></label>
        <button data-addcol="${aid}">Salvar colheita</button>
      </details>
    </article>`;
  }).join("");
}

function balanca(d, pts) {
  if (d.last_scale_raw === null && d.scale_factor === null) return "";
  const calibrada = d.scale_factor !== null;
  let ganho = "—";
  if (d.harvest_base_kg !== null && d.last_weight_kg !== null) {
    ganho = `${(d.last_weight_kg - d.harvest_base_kg >= 0 ? "+" : "")}${kg(d.last_weight_kg - d.harvest_base_kg)} de ${kg(d.harvest_gain_kg)}`;
  } else if (d.harvest_base_at) {
    ganho = "aguardando a próxima pesagem";
  }
  const id = esc(d.id);
  return `<div class="balanca">
      <h3>Balança</h3>
      ${calibrada ? `<div class="grid">
        <div><span>Peso agora</span><b>${kg(d.last_weight_kg)}</b></div>
        <div><span>Ganho desde a melgueira</span><b>${esc(ganho)}</b></div>
      </div>${grafico(pts)}` : '<p class="aviso-txt">Balança ainda não calibrada. Abra os ajustes abaixo.</p>'}
      <details data-bal="${id}" ${abertos.has(d.id) || !calibrada ? "open" : ""}>
        <summary>Ajustes da balança</summary>
        <p class="msg">Última pesagem recebida: ${ago(d.last_scale_raw_at)}.</p>
        <h4>Calibrar</h4>
        <ol class="passos">
          <li>Tire tudo de cima da balança, aperte o botão <b>RST</b> da placa e espere 2 minutos.
            <button class="secundario" data-zero="${id}">1. Balança vazia: zerar</button></li>
          <li>Coloque um peso conhecido (um galão de 5 litros de água pesa <b>5 kg</b>), aperte <b>RST</b> e espere 2 minutos.
            <label>Peso colocado (kg)<input type="number" min="1" max="200" step="0.1" value="5" data-pesokg="${id}"></label>
            <button class="secundario" data-calib="${id}">2. Calibrar</button></li>
          <li>Tire o peso e coloque a colmeia na balança.</li>
        </ol>
        <h4>Colheita e alimento</h4>
        <label>Avisar a colheita quando ganhar (kg)<input type="number" min="1" max="100" step="0.5" value="${esc(d.harvest_gain_kg)}" data-ganho="${id}"></label>
        <label>Avisar falta de alimento abaixo de (kg, opcional)<input type="number" min="1" max="200" step="0.5" value="${esc(d.hunger_kg ?? "")}" data-fome="${id}"></label>
        <button class="secundario" data-salvar="${id}">Salvar</button>
        <button data-melgueira="${id}">Coloquei a melgueira agora</button>
        <p class="msg">Depois de colocar a melgueira, o peso de referência é a próxima pesagem (até 3 horas).</p>
      </details>
    </div>`;
}

function statusDe(d, alertas) {
  const aberto = alertas.find((a) => a.device_id === d.id && ["pendente", "escalado", "roubo_confirmado"].includes(a.status));
  if (d.mode === "roubo") return ['alerta', "RASTREAMENTO INTENSIVO"];
  if (aberto?.kind === "movimento") return ["alerta", "movimento — aguardando resposta"];
  if (aberto?.kind === "offline") return ["aviso", "sem comunicação"];
  if (d.maintenance_until && new Date(d.maintenance_until) > new Date()) return ["aviso", `manutenção até ${fmtDate(d.maintenance_until)}`];
  return ["ok", "protegida"];
}

async function carregar() {
  // Não atualiza enquanto o apicultor está digitando nos ajustes.
  if (document.activeElement?.closest?.("#lista, #producao") && ["INPUT", "SELECT"].includes(document.activeElement.tagName)) return;
  const desde = new Date(Date.now() - 14 * 86400000).toISOString();
  const [{ data: devs, error }, { data: alertas }, { data: apiarios }, { data: pesos }, { data: colheitas }] = await Promise.all([
    sb.from("colmeia_devices").select("*").order("id"),
    sb.from("colmeia_alerts").select("device_id,kind,status,opened_at").order("opened_at", { ascending: false }).limit(200),
    sb.from("colmeia_apiaries").select("id,name"),
    sb.from("colmeia_weights").select("device_id,measured_at,kg").gte("measured_at", desde).not("kg", "is", null)
      .order("measured_at").limit(2000),
    sb.from("colmeia_harvests").select("*").order("harvested_on", { ascending: false }).limit(1000),
  ]);
  if (error) { $("#lista").innerHTML = `<p class="erro card">${esc(errorText(error))}</p>`; return; }
  const nomeApiario = Object.fromEntries((apiarios || []).map((a) => [a.id, a.name]));
  show("#lista");
  $("#producao").innerHTML = producao(apiarios || [], devs || [], colheitas || []);
  show("#producao", (apiarios || []).length > 0);
  if (!devs.length) {
    $("#lista").innerHTML = '<p class="card">Nenhum rastreador ativado. Escaneie o QR Code do rastreador para ativar.</p>';
    return;
  }
  $("#lista").innerHTML = devs.map((d) => {
    const [cls, txt] = statusDe(d, alertas || []);
    const pct = batteryPct(d.last_battery_mv);
    return `<article class="card">
      <h2>${esc(d.hive_label || d.id)} <span class="status ${cls}">${esc(txt)}</span></h2>
      <div class="grid">
        <div><span>Apiário</span><b>${esc(nomeApiario[d.apiary_id] || "—")}</b></div>
        <div><span>Rastreador</span><b>${esc(d.id)}</b></div>
        <div><span>Última mensagem</span><b>${ago(d.last_seen_at)}</b></div>
        <div><span>Bateria</span><b>${pct === null ? "—" : pct + "%"}</b></div>
      </div>
      ${balanca(d, (pesos || []).filter((p) => p.device_id === d.id))}
      ${d.last_lat ? `<a class="btn secundario" target="_blank" href="${mapsLink(d.last_lat, d.last_lon)}">Ver no Google Maps</a>` : ""}
      <button class="secundario" data-mnt="${esc(d.id)}">Vou mexer nas caixas (manutenção 2 h)</button>
      ${d.mode === "roubo" ? `<button class="ok" data-fim="${esc(d.id)}">Caixa recuperada / falso alarme</button>` : ""}
    </article>`;
  }).join("");

  document.querySelectorAll("[data-mnt]").forEach((b) => b.onclick = async () => {
    const { error } = await sb.rpc("colmeia_set_maintenance", { p_device_id: b.dataset.mnt, p_minutes: 120 });
    if (error) alert(errorText(error)); else carregar();
  });
  document.querySelectorAll("details[data-bal]").forEach((el) => el.ontoggle = () => {
    if (el.open) abertos.add(el.dataset.bal); else abertos.delete(el.dataset.bal);
  });
  const rpc = async (b, nome, args, ok) => {
    b.disabled = true;
    const { error } = await sb.rpc(nome, args);
    b.disabled = false;
    if (error) alert(errorText(error)); else { if (ok) alert(ok); carregar(); }
  };
  const num = (sel) => { const v = document.querySelector(sel)?.value.trim(); return v ? Number(v) : null; };
  document.querySelectorAll("[data-zero]").forEach((b) => b.onclick = () =>
    rpc(b, "colmeia_scale_calibrate", { p_device_id: b.dataset.zero, p_step: "zero" }, "Balança zerada. Agora faça o passo 2."));
  document.querySelectorAll("[data-calib]").forEach((b) => b.onclick = () =>
    rpc(b, "colmeia_scale_calibrate", { p_device_id: b.dataset.calib, p_step: "peso",
      p_kg: num(`[data-pesokg="${b.dataset.calib}"]`) }, "Balança calibrada."));
  const harvest = (b, id, mark) => rpc(b, "colmeia_set_harvest", { p_device_id: id,
    p_gain_kg: num(`[data-ganho="${id}"]`), p_hunger_kg: num(`[data-fome="${id}"]`), p_mark_super: mark },
    mark ? "Anotado. O peso de referência será a próxima pesagem." : "Ajustes salvos.");
  document.querySelectorAll("[data-salvar]").forEach((b) => b.onclick = () => harvest(b, b.dataset.salvar, false));
  document.querySelectorAll("[data-melgueira]").forEach((b) => b.onclick = () => {
    if (confirm("Você acabou de colocar uma melgueira vazia nesta colmeia?")) harvest(b, b.dataset.melgueira, true);
  });
  document.querySelectorAll("[data-addcol]").forEach((b) => b.onclick = () => {
    const id = b.dataset.addcol;
    const v = (k) => document.getElementById(`col-${k}-${id}`).value.trim();
    rpc(b, "colmeia_add_harvest", { p_apiary_id: id, p_device_id: v("cx"), p_date: v("dt") || null,
      p_kg: v("kg") ? Number(v("kg").replace(",", ".")) : null, p_note: v("obs") || null }, "Colheita registrada.");
  });
  document.querySelectorAll("[data-delcol]").forEach((b) => b.onclick = () => {
    if (confirm("Apagar esta colheita?")) rpc(b, "colmeia_delete_harvest", { p_id: Number(b.dataset.delcol) });
  });
  document.querySelectorAll("[data-fim]").forEach((b) => b.onclick = async () => {
    if (!confirm("Encerrar o rastreamento intensivo desta caixa?")) return;
    const { error } = await sb.rpc("colmeia_end_theft_mode", { p_device_id: b.dataset.fim });
    if (error) alert(errorText(error)); else carregar();
  });

  const pts = devs.filter((d) => d.last_lat);
  if (pts.length && window.L) {
    show("#mapa-card");
    if (!map) {
      map = L.map("map");
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
    }
    if (layer) layer.remove();
    layer = L.featureGroup(pts.map((d) => L.marker([d.last_lat, d.last_lon]).bindPopup(esc(d.hive_label || d.id)))).addTo(map);
    map.fitBounds(layer.getBounds(), { maxZoom: 16, padding: [30, 30] });
  }
}

ensureLogin($("#login"), () => {
  show("#login", false);
  show("#sair");
  carregar();
  setInterval(carregar, 30000);
});
$("#sair").onclick = async () => { await sb.auth.signOut(); location.reload(); };
</script>
</body>
</html>

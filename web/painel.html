<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus rastreadores</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="icone.png">
<link rel="apple-touch-icon" href="icone.png">
<meta name="theme-color" content="#111111">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>
<header><a class="marca" href="index.html"><img src="icone.png" alt="" width="40" height="40"><span>BEEGUARD<small>Meus rastreadores</small></span></a></header>
<main>
  <section class="card" id="login"><p class="msg">Carregando… (precisa de internet)</p></section>
  <nav class="barra" id="barra" hidden>
    <div class="alternar" role="group" aria-label="Ver o painel por">
      <span>Ver por:</span>
      <button type="button" data-ver="colmeia">Colmeia</button>
      <button type="button" data-ver="apiario">Apiário</button>
    </div>
    <a class="btn secundario" href="apiarios.html">Meus apiários e colmeias</a>
    <button type="button" class="secundario" id="link-todos">Link de todos os apiários</button>
  </nav>
  <section id="lista" hidden></section>
  <section id="producao" hidden></section>
  <section class="card" id="mapa-card" hidden><h2>Mapa</h2><div id="map"></div></section>
  <button class="secundario" id="sair" hidden>Sair</button>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module">
import { $, show, sb, ensureLogin, ago, fmtDate, batteryPct, mapsLink, errorText, esc } from "./app.js";
import { balanca, producao, statusDe } from "./render.js";

let map, layer;
const abertos = new Set();  // balanças com os ajustes abertos (sobrevive à atualização automática)
let ver = "colmeia";        // "colmeia" (lista de caixas) ou "apiario" (agrupado por apiário)
try { ver = localStorage.getItem("beeguard-ver") === "apiario" ? "apiario" : "colmeia"; } catch { /* sem armazenamento */ }
const natural = (x, y) => String(x).localeCompare(String(y), "pt-BR", { numeric: true });

// Situação do apiário: ataque (2+ caixas em alerta), alerta, manutenção ou protegido.
function situacaoApiario(ds, alertas) {
  const emAlerta = ds.filter((d) => statusDe(d, alertas)[0] === "alerta");
  if (emAlerta.length >= 2) return ["alerta", `ATAQUE AO APIÁRIO: ${emAlerta.length} caixas`];
  if (emAlerta.length === 1) return ["alerta", `alerta em ${emAlerta[0].hive_label || emAlerta[0].id}`];
  if (ds.length && ds.every((d) => d.maintenance_until && new Date(d.maintenance_until) > new Date())) {
    return ["aviso", `manutenção até ${fmtDate(ds[0].maintenance_until)}`];
  }
  return ["ok", ds.length ? "protegido" : "sem rastreador"];
}

async function carregar() {
  // Não atualiza enquanto o apicultor está digitando nos ajustes.
  if (document.activeElement?.closest?.("#lista, #producao") && ["INPUT", "SELECT"].includes(document.activeElement.tagName)) return;
  const desde = new Date(Date.now() - 14 * 86400000).toISOString();
  const [{ data: devs, error }, { data: alertas }, { data: apiarios }, { data: pesos }, { data: colheitas }, { data: hives }] = await Promise.all([
    sb.from("colmeia_devices").select("*").order("id"),
    sb.from("colmeia_alerts").select("device_id,kind,status,opened_at").order("opened_at", { ascending: false }).limit(200),
    sb.from("colmeia_apiaries").select("id,name,city").order("name"),
    sb.from("colmeia_weights").select("device_id,measured_at,kg").gte("measured_at", desde).not("kg", "is", null)
      .order("measured_at").limit(2000),
    sb.from("colmeia_harvests").select("*").order("harvested_on", { ascending: false }).limit(1000),
    sb.from("colmeia_hives").select("id,apiary_id,label"),
  ]);
  if (error) { $("#lista").innerHTML = `<p class="erro card">${esc(errorText(error))}</p>`; return; }
  const nomeApiario = Object.fromEntries((apiarios || []).map((a) => [a.id, a.name]));
  show("#barra");
  // Link só de visualização: de um apiário ou (apiário vazio) de todos.
async function compartilhar(b, apiaryId) {
  const exata = confirm("Mostrar a localização EXATA das caixas no link (alfinete no mapa e Google Maps)?\n\n"
    + "OK = localização exata (só mande para quem você confia)\nCancelar = só a região, cerca de 1 km (mais seguro)");
  b.disabled = true;
  const { data: token, error } = await sb.rpc("colmeia_share_link", { p_apiary_id: apiaryId || null, p_exact: exata });
  b.disabled = false;
  if (error) return alert(errorText(error));
  const link = `${location.origin}/ver.html?t=${token}`;
  try { await navigator.clipboard.writeText(link); } catch { /* sem permissão: mostra o link */ }
  prompt(`Link copiado. Quem abrir vê as caixas e a produção, ${exata ? "com a localização exata" : "com a região aproximada"}, sem poder mudar nada (vale 90 dias):`, link);
}
$("#link-todos").onclick = (ev) => compartilhar(ev.currentTarget, null);

document.querySelectorAll("[data-ver]").forEach((b) => b.classList.toggle("ativo", b.dataset.ver === ver));
  const aps = apiarios || [], hs = hives || [], al = alertas || [];
  const opts = { abertos, hives: hs };

  const cartao = (d) => {
    const [cls, txt] = statusDe(d, al);
    const pct = batteryPct(d.last_battery_mv);
    return `<article class="card">
      <h2>${esc(d.hive_label || d.id)} <span class="status ${cls}">${esc(txt)}</span></h2>
      <div class="grid">
        <div><span>Apiário</span><b>${esc(nomeApiario[d.apiary_id] || "—")}</b></div>
        <div><span>Rastreador</span><b>${esc(d.id)}</b></div>
        <div><span>Última mensagem</span><b>${ago(d.last_seen_at)}</b></div>
        <div><span>Bateria</span><b>${pct === null ? "—" : pct + "%"}</b></div>
        <div><span>Sinal do chip</span><b>${d.last_signal == null || d.last_signal === 99 ? "—" : esc(d.last_signal >= 15 ? "bom" : d.last_signal >= 10 ? "médio" : "fraco") + ` (${esc(d.last_signal)}/31)`}</b></div>
      </div>
      ${balanca(d, (pesos || []).filter((p) => p.device_id === d.id), { abertos })}
      ${d.last_lat ? `<a class="btn secundario" target="_blank" href="${mapsLink(d.last_lat, d.last_lon)}">Ver no Google Maps</a>` : ""}
      <button class="secundario" data-mnt="${esc(d.id)}">Vou mexer nesta caixa (manutenção 2 h)</button>
      ${d.mode === "roubo" || cls === "alerta" ? `<button class="perigo" data-trajeto="${esc(d.id)}">Ver trajeto e alerta</button>` : ""}
      ${d.mode === "roubo" ? `<button class="ok" data-fim="${esc(d.id)}">Caixa recuperada / falso alarme</button>` : ""}
    </article>`;
  };

  // Resumo do apiário: situação, colmeias, peso da sentinela, mel do ano e ações para o apiário todo.
  const resumo = (a, ds) => {
    const [cls, txt] = situacaoApiario(ds, al);
    const ano = new Date().getFullYear();
    const mel = (colheitas || []).filter((h) => h.apiary_id === a.id && h.harvested_on.startsWith(String(ano)))
      .reduce((t, h) => t + Number(h.kg), 0);
    const sentinela = ds.find((d) => d.last_weight_kg !== null && d.last_weight_kg !== undefined);
    const total = hs.filter((h) => h.apiary_id === a.id).length;
    const roubo = ds.some((d) => d.mode === "roubo");
    return `<article class="card grupo ${cls === "alerta" ? "grupo-alerta" : ""}">
      <h2>${esc(a.name)} <span class="status ${cls}">${esc(txt)}</span><small>${esc(a.city || "")}</small></h2>
      <div class="grid">
        <div><span>Colmeias</span><b>${total}</b></div>
        <div><span>Com rastreador</span><b>${ds.length}</b></div>
        <div><span>Peso (colmeia sentinela)</span><b>${sentinela ? esc(Number(sentinela.last_weight_kg).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " kg") : "—"}</b></div>
        <div><span>Mel colhido em ${ano}</span><b>${esc(mel.toLocaleString("pt-BR", { maximumFractionDigits: 1 }))} kg</b></div>
      </div>
      ${ds.length ? `<button class="secundario" data-mnt-ap="${esc(a.id)}">Vou mexer no apiário todo (manutenção 2 h)</button>` : ""}
      ${roubo ? `<button class="ok" data-fim-ap="${esc(a.id)}">Falso alarme / caixas recuperadas (apiário todo)</button>` : ""}
    </article>`;
  };

  const ordenadas = [...devs].sort((x, y) => natural(nomeApiario[x.apiary_id] || "", nomeApiario[y.apiary_id] || "")
    || natural(x.hive_label || x.id, y.hive_label || y.id));
  if (ver === "apiario") {
    $("#lista").innerHTML = aps.map((a) => {
      const ds = ordenadas.filter((d) => d.apiary_id === a.id);
      return `<div class="bloco-apiario">${resumo(a, ds)}${ds.map(cartao).join("")}
        ${producao([a], devs, colheitas || [], opts)}</div>`;
    }).join("") || '<p class="card">Nenhum apiário cadastrado. Crie em "Meus apiários e colmeias".</p>';
    $("#producao").innerHTML = "";
    show("#producao", false);
  } else {
    $("#lista").innerHTML = ordenadas.map(cartao).join("")
      || '<p class="card">Nenhum rastreador ativado. Escaneie o QR Code do rastreador para ativar.</p>';
    $("#producao").innerHTML = producao(aps, devs, colheitas || [], opts);
    show("#producao", aps.length > 0);
  }
  show("#lista");

  document.querySelectorAll("[data-mnt]").forEach((b) => b.onclick = async () => {
    const { error } = await sb.rpc("colmeia_set_maintenance", { p_device_id: b.dataset.mnt, p_minutes: 120 });
    if (error) alert(errorText(error)); else carregar();
  });
  document.querySelectorAll("details[data-bal]").forEach((el) => el.ontoggle = () => {
    if (el.open) abertos.add(el.dataset.bal); else abertos.delete(el.dataset.bal);
  });
  const rpc = async (b, nome, args, ok) => {
    b.disabled = true;
    const { error } = await sb.rpc(nome, args);
    b.disabled = false;
    if (error) alert(errorText(error)); else { if (ok) alert(ok); carregar(); }
  };
  const num = (sel) => { const v = document.querySelector(sel)?.value.trim(); return v ? Number(v) : null; };
  document.querySelectorAll("[data-zero]").forEach((b) => b.onclick = () =>
    rpc(b, "colmeia_scale_calibrate", { p_device_id: b.dataset.zero, p_step: "zero" }, "Balança zerada. Agora faça o passo 2."));
  document.querySelectorAll("[data-calib]").forEach((b) => b.onclick = () =>
    rpc(b, "colmeia_scale_calibrate", { p_device_id: b.dataset.calib, p_step: "peso",
      p_kg: num(`[data-pesokg="${b.dataset.calib}"]`) }, "Balança calibrada."));
  const harvest = (b, id, mark) => rpc(b, "colmeia_set_harvest", { p_device_id: id,
    p_gain_kg: num(`[data-ganho="${id}"]`), p_hunger_kg: num(`[data-fome="${id}"]`), p_mark_super: mark },
    mark ? "Anotado. O peso de referência será a próxima pesagem." : "Ajustes salvos.");
  document.querySelectorAll("[data-salvar]").forEach((b) => b.onclick = () => harvest(b, b.dataset.salvar, false));
  document.querySelectorAll("[data-melgueira]").forEach((b) => b.onclick = () => {
    if (confirm("Você acabou de colocar uma melgueira vazia nesta colmeia?")) harvest(b, b.dataset.melgueira, true);
  });
  document.querySelectorAll("[data-addcol]").forEach((b) => b.onclick = () => {
    const id = b.dataset.addcol;
    const v = (k) => document.getElementById(`col-${k}-${id}`).value.trim();
    rpc(b, "colmeia_add_harvest", { p_apiary_id: id, p_device_id: "", p_hive_id: v("cx") || null, p_date: v("dt") || null,
      p_kg: v("kg") ? Number(v("kg").replace(",", ".")) : null, p_note: v("obs") || null }, "Colheita registrada.");
  });
  document.querySelectorAll("[data-delcol]").forEach((b) => b.onclick = () => {
    if (confirm("Apagar esta colheita?")) rpc(b, "colmeia_delete_harvest", { p_id: Number(b.dataset.delcol) });
  });
  document.querySelectorAll("[data-share]").forEach((b) => b.onclick = () => compartilhar(b, b.dataset.share));
  document.querySelectorAll("[data-mnt-ap]").forEach((b) => b.onclick = async () => {
    const { error } = await sb.rpc("colmeia_set_apiary_maintenance", { p_apiary_id: b.dataset.mntAp, p_minutes: 120 });
    if (error) alert(errorText(error)); else { alert("Apiário em manutenção por 2 horas: mexer nas caixas não gera alerta."); carregar(); }
  });
  document.querySelectorAll("[data-fim-ap]").forEach((b) => b.onclick = async () => {
    if (!confirm("Encerrar o rastreamento intensivo de todas as caixas deste apiário?")) return;
    const { error } = await sb.rpc("colmeia_end_apiary_alarm", { p_apiary_id: b.dataset.fimAp });
    if (error) alert(errorText(error)); else carregar();
  });
  document.querySelectorAll("[data-trajeto]").forEach((b) => b.onclick = async () => {
    b.disabled = true;
    const { data: t, error } = await sb.rpc("colmeia_open_alert_token", { p_device_id: b.dataset.trajeto });
    b.disabled = false;
    if (error) return alert(errorText(error));
    location.href = `alerta.html?t=${t}`;
  });
  document.querySelectorAll("[data-fim]").forEach((b) => b.onclick = async () => {
    if (!confirm("Encerrar o rastreamento intensivo desta caixa?")) return;
    const { error } = await sb.rpc("colmeia_end_theft_mode", { p_device_id: b.dataset.fim });
    if (error) alert(errorText(error)); else carregar();
  });

  const pts = devs.filter((d) => d.last_lat);
  if (pts.length && window.L) {
    show("#mapa-card");
    if (!map) {
      map = L.map("map");
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
    }
    if (layer) layer.remove();
    layer = L.featureGroup(pts.map((d) => L.marker([d.last_lat, d.last_lon]).bindPopup(esc(d.hive_label || d.id)))).addTo(map);
    map.fitBounds(layer.getBounds(), { maxZoom: 16, padding: [30, 30] });
  }
}

document.querySelectorAll("[data-ver]").forEach((b) => b.onclick = () => {
  ver = b.dataset.ver;
  try { localStorage.setItem("beeguard-ver", ver); } catch { /* sem armazenamento */ }
  carregar();
});

ensureLogin($("#login"), () => {
  show("#login", false);
  show("#sair");
  carregar();
  setInterval(carregar, 30000);
});
$("#sair").onclick = async () => { await sb.auth.signOut(); location.reload(); };
</script>
</body>
</html>

; Firmware do rastreador Bee Guard
; Placa: LILYGO T-A7670SA R2 (ESP32) + acelerômetro ADXL345
;
; Compilar:  pio run
; Gravar:    pio run -t upload
; Monitor:   pio device monitor

[platformio]
default_envs = t-a7670

[env:t-a7670]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
build_flags =
    -mfix-esp32-psram-cache-issue
    -DBOARD_HAS_PSRAM
    -DTINY_GSM_MODEM_A7670
    -DTINY_GSM_RX_BUFFER=1024
; A biblioteca TinyGSM (versão da LILYGO, com HTTPS e GPS do A7670) está em lib/TinyGSM.

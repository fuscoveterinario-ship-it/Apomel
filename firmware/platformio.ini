; Firmware do rastreador Bee Guard
; Duas placas suportadas (escolha o ambiente ao compilar/gravar):
;   t-a7670        LILYGO T-A7670SA R2  (produção: 4G Cat-1 + 2G)
;   t-sim7080g-s3  LILYGO T-SIM7080G-S3 (protótipo: Cat-M/NB-IoT, baixo consumo)
;
; Compilar:  pio run -e t-sim7080g-s3
; Gravar:    pio run -e t-sim7080g-s3 -t upload
; Monitor:   pio device monitor

[platformio]
default_envs = t-sim7080g-s3

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
; Bibliotecas da LILYGO copiadas em lib/ (TinyGSM com HTTPS/GPS e XPowersLib).

[env:t-a7670]
board = esp32dev
build_flags =
    -mfix-esp32-psram-cache-issue
    -DBOARD_HAS_PSRAM
    -DBOARD_T_A7670
    -DTINY_GSM_MODEM_A7670
    -DTINY_GSM_RX_BUFFER=1024

[env:t-sim7080g-s3]
board = esp32s3box
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_T_SIM7080G_S3
    -DTINY_GSM_MODEM_SIM7080
    -DTINY_GSM_RX_BUFFER=1024

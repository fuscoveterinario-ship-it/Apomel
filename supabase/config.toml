# Configuração das funções para o Supabase CLI (supabase functions deploy).
[functions.colmeia-ingest]
# O rastreador não tem login: ele se autentica pela assinatura HMAC.
verify_jwt = false

[functions.colmeia-dispatch]
verify_jwt = true

[functions.colmeia-login]
# Chamada pelo site com a chave pública (anon), antes do login.
verify_jwt = true
